services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: settlement
      POSTGRES_PASSWORD: settlement
      POSTGRES_DB: settlement_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlement -d settlement_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://settlement:settlement@postgres:5432/settlement_ai
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-3-flash-preview
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-settlement-ai-dev-secret-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./content/docs:/app/content/docs:ro
    command: >
      sh -c "python scripts/seed_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"

volumes:
  postgres_data:
